[workspace]
resolver = "2"
members = [
    "crates/openanty-proto",
    "crates/openanty-fp",
    "crates/openanty-core",
    "crates/openantyd",
    "crates/openanty-cli",
]
default-members = [
    "crates/openantyd",
    "crates/openanty-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openanty/openanty"
authors = ["Open Anty Contributors"]
rust-version = "1.75"

[workspace.dependencies]
openanty-proto = { path = "crates/openanty-proto", version = "0.1.0" }
openanty-fp = { path = "crates/openanty-fp", version = "0.1.0" }
openanty-core = { path = "crates/openanty-core", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
parking_lot = "0.12"
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
regex = "1"
which = "7"
